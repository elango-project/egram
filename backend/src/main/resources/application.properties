# ============================================================
# Egram Backend – Application Configuration
# ============================================================

spring.application.name=egram-backend

# ------------------------------------------------------------
# Database – PostgreSQL
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-hidden-cake-aoocspgi-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_NCsHOdlKD07e}

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api

# ------------------------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ------------------------------------------------------------
# JWT Config
# ------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-minimum-32-chars}
jwt.expiration=86400000

# ------------------------------------------------------------
# Admin Seeder
# ------------------------------------------------------------
egram.seed-admin=true

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.egram=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
